name: beehive_guard
description: "양봉장 말벌 집단 공격 조기 감지 시스템 — Monitoring / Manager 겸용 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # --- State management & navigation ---
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # --- Networking ---
  dio: ^5.11.1

  # --- Immutable models & JSON ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # --- Sensors (this phone IS the sensor) ---
  camera: ^0.12.1
  record: ^7.1.1
  image: ^4.10.1
  permission_handler: ^13.0.2

  # --- Push notifications ---
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # --- Local persistence (selected mode / hive) ---
  shared_preferences: ^2.5.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
